name: Mutation Tests

on: [push, pull_request]

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: PHP 8.5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gmp
          tools: composer:v2
          coverage: xdebug
      - name: Composer install
        run: |
          for i in 1 2 3; do composer install -n --prefer-dist --no-progress && exit 0; sleep 10; done
          exit 1
      - name: Run infection
        run: vendor/bin/roave-infection-static-analysis-plugin --threads=2 --logger-github --ignore-msi-with-no-mutations
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          XDEBUG_MODE: coverage
